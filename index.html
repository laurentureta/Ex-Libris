@keyframes sgOpen{to{transform:rotateY(-160deg)}}
.sg-light{inset:-40px!important;border-radius:50%!important;background:radial-gradient(closest-side,rgba(255,230,160,.8),rgba(255,200,110,0));opacity:0;animation:sgLight 1.4s ease 1.2s forwards}
@keyframes sgLight{to{opacity:1}}

/* ───── Oracle ───── */
.oracle{position:fixed;inset:0;z-index:87;visibility:hidden;opacity:0;transition:opacity .45s,visibility 0s .45s;background:radial-gradient(80% 60% at 50% 45%,#2B2040,#0B0812 70%);color:#F6EEDD;overflow:hidden}
.oracle.on{visibility:visible;opacity:1;transition:opacity .45s}
#orFx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.or-x{position:absolute;top:calc(var(--st) + 12px);right:14px;width:40px;height:40px;border-radius:50%;color:#F6EEDD;background:rgba(255,255,255,.1);font-size:22px;z-index:3}
.or-book{position:absolute;left:50%;top:44%;width:150px;height:200px;margin:-100px 0 0 -75px;perspective:900px;cursor:pointer;transition:transform .8s cubic-bezier(.2,.9,.25,1),opacity .6s;animation:orFloat 3.4s ease-in-out infinite}
@keyframes orFloat{50%{translate:0 -12px}}
.or-book i{position:absolute;inset:0;border-radius:3px 8px 8px 3px}
.or-back{background:linear-gradient(90deg,#1A0626,#2E1446);box-shadow:0 30px 50px -10px rgba(0,0,0,.7);transform:translate(7px,6px)}
.or-book::after{content:"";position:absolute;right:-7px;top:6px;bottom:-6px;width:7px;background:repeating-linear-gradient(0deg,#EDE3CF 0 1.5px,#CDBFA2 1.5px 3px);border-radius:0 2px 2px 0;transform:skewY(40deg);transform-origin:0 0}
.or-pages{inset:6px 5px 6px 10px!important;background:repeating-linear-gradient(90deg,#EDE3CF 0 2px,#D8CBAE 2px 3px)}
.or-leaf{inset:6px 5px 6px 10px!important;background:linear-gradient(90deg,#D8CBAE,#F6EEDD 30%,#E9DEC8);transform-origin:0 50%;opacity:0}
.or-cover{background:radial-gradient(120% 80% at 30% 20%,#5A2A7A,#2E1446 55%,#160828);box-shadow:inset 0 0 0 2px rgba(212,175,103,.65);transform-origin:0 50%;transition:transform 1s cubic-bezier(.55,.05,.25,1);display:flex;align-items:center;justify-content:center;-webkit-backface-visibility:hidden;backface-visibility:hidden}
.or-cover svg{width:56px;height:56px;color:#E9C46A;filter:drop-shadow(0 0 8px rgba(233,196,106,.7))}
.oracle.open .or-cover{transform:rotateY(-165deg)}
.oracle.spin .or-leaf{opacity:1;animation:orLeaf .32s linear infinite;animation-delay:calc(var(--i) * -.064s)}
@keyframes orLeaf{from{transform:rotateY(0)}to{transform:rotateY(-180deg)}}
.oracle.spin .or-book{animation:orFloat 3.4s ease-in-out infinite,orShake .12s linear infinite}
@keyframes orShake{50%{transform:translateX(1.5px) rotate(.4deg)}}
.oracle.done .or-book{transform:translateY(32vh) scale(.6);opacity:.35}
.or-glow{position:absolute;left:50%;top:44%;width:420px;height:420px;margin:-210px 0 0 -210px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,226,150,.55),rgba(255,190,100,0));opacity:0;transition:opacity .6s;pointer-events:none}
.oracle.spin .or-glow{opacity:1;animation:halo .5s ease-in-out infinite alternate}
.or-hint{position:absolute;left:0;right:0;bottom:calc(var(--sb) + 60px);text-align:center;font-family:var(--serif);font-style:italic;font-size:18px;color:rgba(246,238,221,.75);animation:fadeP 2.4s ease-in-out infinite}
@keyframes fadeP{50%{opacity:.45}}
.or-title{position:absolute;left:0;right:0;top:calc(var(--st) + 60px);text-align:center;font-size:12px;letter-spacing:.26em;text-transform:uppercase;font-weight:700;color:#E9C46A}
#orRes{position:absolute;left:0;right:0;top:calc(var(--st) + 90px);display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:0 28px;pointer-events:none;opacity:0;transition:opacity .4s}
.oracle.show #orRes{opacity:1;pointer-events:auto}
#orRes .or-cover{position:relative;-webkit-backface-visibility:visible;backface-visibility:visible}
#orRes .or-cover{width:150px;height:225px;border-radius:3px;background:none;box-shadow:none;transform:none;animation:orRise 1.3s cubic-bezier(.2,.9,.25,1) both}
#orRes .or-cover img{width:100%;height:100%;object-fit:cover;border-radius:3px;box-shadow:0 0 50px rgba(255,214,140,.55),0 20px 40px rgba(0,0,0,.6)}
#orRes .or-cover i{position:absolute;inset:-2px;border-radius:4px;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.5) 48%,transparent 62%);background-size:250% 100%;animation:shineSweep 1.6s ease 1.1s both;mix-blend-mode:overlay}
@keyframes orRise{from{transform:translateY(170px) scale(.3) rotateY(540deg);opacity:0}60%{opacity:1}}
@keyframes shineSweep{from{background-position:150% 0}to{background-position:-60% 0}}
.or-k{font-size:12px;letter-spacing:.22em;text-transform:uppercase;font-weight:700;color:#E9C46A;margin-top:8px}
.or-t{font-family:var(--serif);font-size:28px;font-weight:600;line-height:1.1}
.or-t .w{display:inline-block;white-space:nowrap}
.or-t .ich{display:inline-block;opacity:0;filter:blur(6px);animation:ink .6s ease forwards;animation-delay:calc(var(--i) * 30ms + .9s)}
.or-a{font-family:var(--serif);font-style:italic;font-size:16px;color:rgba(246,238,221,.75)}
.or-btns{display:flex;flex-direction:column;gap:10px;width:100%;max-width:300px;margin-top:10px}
.or-btns button,#orRes>.btn-main{height:52px;border-radius:26px;font-weight:600;font-size:16px}
.oracle .btn-main{background:#F6EEDD;color:#1A1714}
.oracle .btn-plain{background:rgba(255,255,255,.14);color:#F6EEDD}
.or-empty{font-family:var(--serif);font-style:italic;font-size:19px;line-height:1.45;max-width:300px;margin-top:20vh}
#orRes>.btn-main{width:100%;max-width:300px}
.title-row .hd-r{display:flex;align-items:center;gap:8px}
.oracle-btn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--accent);flex:none}
.oracle-btn svg{width:19px;height:19px}

/* ───── Saisons et bougie ───── */

.cl-mv{z-index:1}
.cdl{position:absolute;left:0;top:0;width:0;height:0}
.cdl i{position:absolute;display:block}
.cdl .fl{left:-6px;top:-24px;width:12px;height:24px;border-radius:50% 50% 45% 45%/60% 60% 40% 40%;background:radial-gradient(circle at 50% 72%,#FFFFFF 0,#FFE9A8 28%,#FFB347 58%,rgba(255,140,40,0) 72%);animation:flick .16s ease-in-out infinite alternate;transform-origin:50% 100%;filter:drop-shadow(0 0 8px rgba(255,180,80,.9))}
.cdl .wk{left:-.75px;top:-3px;width:1.5px;height:5px;background:#2A1A0E}

const isoDay = d => { const z = new Date(d); return `${z.getFullYear()}-${String(z.getMonth() + 1).padStart(2, '0')}-${String(z.getDate()).padStart(2, '0')}`; };

function seedDemo(){
  if (!DEMO || S.seeded) return; S.seeded = true;
  const demo = books.filter(b => !b.user); if (!demo.length) { save(); return; }
  if (!S.goal) S.goal = 10;
  const td = todayIso();
  const FIN = {5:'01-18', 6:'02-22', 7:'03-30', 8:'05-12', 9:'06-08', 10:'07-03', 11:'08-15', 12:'09-28', 13:'10-21'};
  const R = {5:4.5, 6:4, 7:3.5, 8:5, 9:4, 10:4.5, 11:4, 12:5, 13:3.5}, ST = {1:24, 2:10, 3:5, 4:40};

function dustBurst(src, r){
  const cv = $('#dust'), dpr = Math.min(window.devicePixelRatio || 1, 2), W = innerWidth, H = VH();
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); cv.style.display = 'block';
  const x = cv.getContext('2d'); x.setTransform(dpr, 0, 0, dpr, 0, 0);
  const tile = 6, cols = Math.ceil(r.width / tile), rows = Math.ceil(r.height / tile), sw = src.width / cols, sh = src.height / rows;
  const P = [];
  for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
    const u = i / cols, v = j / rows;
    P.push({sx:i * sw, sy:j * sh, x:r.left + i * tile, y:r.top + j * tile, d:u * 0.75 + (1 - v) * 0.1 + Math.random() * 0.28,
      vx:60 + Math.random() * 200, vy:-(30 + Math.random() * 130), ph:Math.random() * 6.28, f:2 + Math.random() * 3, life:0.9 + Math.random() * 0.6});
  }
  const sparks = []; for (let i = 0; i < 80; i++) sparks.push({x:r.left + Math.random() * r.width, y:r.top + Math.random() * r.height, d:Math.random() * 1.0, vx:90 + Math.random() * 240, vy:-(50 + Math.random() * 190), s:0.8 + Math.random() * 2, life:0.8 + Math.random() * 0.7});
  const t0 = performance.now();
  // mouvement calculé à partir du temps écoulé : même rendu à 60 ou 120 Hz
  (function step(now){
    const T = (now - t0) / 1000;
    x.clearRect(0, 0, W, H); let alive = false;
    for (const p of P) {
      const a = T - p.d;
      if (a <= 0) { x.globalAlpha = 1; x.drawImage(src, p.sx, p.sy, sw, sh, p.x, p.y, tile + 0.5, tile + 0.5); alive = true; continue; }
      const k = a / p.life; if (k >= 1) continue; alive = true;
      const px = p.x + p.vx * a * (1 - 0.25 * a) + Math.sin(a * p.f * 2.4 + p.ph) * 26 * a;
      const py = p.y + p.vy * a - 26 * a * a + Math.cos(a * p.f * 1.8 + p.ph) * 12 * a;
      const sz = tile * (1 - k * 0.7);
      x.globalAlpha = (1 - k) * (1 - k * 0.5);
      x.drawImage(src, p.sx, p.sy, sw, sh, px, py, sz, sz);
    }
    x.fillStyle = '#F3DFA2';
    for (const s of sparks) {
      const a = T - s.d; if (a <= 0) { alive = true; continue; } const k = a / s.life; if (k >= 1) continue; alive = true;
      x.globalAlpha = (1 - k) * 0.9; x.beginPath(); x.arc(s.x + s.vx * a, s.y + s.vy * a - 30 * a * a, s.s * (1 - k * 0.5), 0, 6.283); x.fill();
    }
    x.globalAlpha = 1;
    if (alive && T < 3.5) requestAnimationFrame(step); else { x.clearRect(0, 0, W, H); cv.style.display = 'none'; }
  })(t0);
}

const sealCfg = () => Object.assign({ini:'', em:'plume', col:'rouge'}, S.seal || {});
function sealSVG(cfg, uid){
  cfg = cfg || sealCfg(); uid = uid || 's' + Math.floor(Math.random() * 1e6);

  const N = 18, pts = [];
  for (let i = 0; i < N; i++) { const a = i / N * Math.PI * 2, r = 50 + (rnd() - .5) * 5 + Math.sin(a * 3 + rnd()) * 1.6; pts.push([60 + Math.cos(a) * r, 60 + Math.sin(a) * r]); }
  let d = `M${((pts[0][0] + pts[N - 1][0]) / 2).toFixed(1)} ${((pts[0][1] + pts[N - 1][1]) / 2).toFixed(1)}`;
  for (let i = 0; i < N; i++) { const p = pts[i], q = pts[(i + 1) % N]; d += `Q${p[0].toFixed(1)} ${p[1].toFixed(1)} ${((p[0] + q[0]) / 2).toFixed(1)} ${((p[1] + q[1]) / 2).toFixed(1)}`; }

  const emblem = ini ? [emb(`${60 - 12 * .62} ${32 - 12 * .62}`, .62, deep), emb(`${60 - 12 * .62 - .7} ${32 - 12 * .62 - .7}`, .62, light)] : [emb(`${60 - 12 * 1.55} ${60 - 12 * 1.55}`, 1.55, deep), emb(`${60 - 12 * 1.55 - .9} ${60 - 12 * 1.55 - .9}`, 1.55, light)];

    <path d="${d}" fill="url(#w${uid})"/><path d="${d}" fill="none" stroke="${deep}" stroke-opacity=".35" stroke-width="1.5"/>
    <circle cx="60" cy="60" r="37" fill="url(#d${uid})"/><circle cx="60" cy="60" r="37" fill="none" stroke="url(#r${uid})" stroke-width="2.2"/><circle cx="60" cy="60" r="33" fill="none" stroke="${deep}" stroke-opacity=".4" stroke-width=".8"/>

}

}

const Shake = {last:null, hits:[], cool:0};

/* ═════════════ Saisons et bougie du soir ═════════════ */
const AMB = {on:false, raf:0, P:[], last:0, kind:null, candle:false, cx:0, cy:0, tx:0, ty:0, touch:false, rest:null};
function seasonNow(){
  const m = (location.hash.match(/season=(\w+)/) || [])[1]; if (m) return m;
  const mo = new Date().getMonth(); return mo === 11 || mo <= 1 ? 'winter' : mo <= 4 ? 'spring' : mo <= 7 ? 'summer' : 'autumn';
}
const candleTime = () => /candle/.test(location.hash) || (h => h >= 19 || h < 6)(new Date().getHours());
function ambSpawn(init, W, H){
  const k = AMB.kind, r = Math.random;
  if (k === 'winter') return {x:r() * W, y:init ? r() * H : -10, vy:16 + r() * 30, sw:10 + r() * 18, ph:r() * 6, s:1 + r() * 2.4};

  if (k === 'spring') return {x:r() * W, y:init ? r() * H : -15, vy:18 + r() * 22, sw:30 + r() * 30, ph:r() * 6, s:4 + r() * 3.5, rot:r() * 6, vr:(r() - .5) * 2.5, c:['#F2B8C6', '#E89AAE', '#FAD4DD', '#F7C6D3'][Math.floor(r() * 4)]};
  return {x:r() * W, y:init ? r() * H : H + 10, vy:-(5 + r() * 10), sw:20 + r() * 20, ph:r() * 6, s:1.4 + r() * 1.8};
}
function leaf(x, p, t){
  x.save(); x.translate(p.x, p.y); x.rotate(p.rot); x.scale(1, Math.abs(Math.cos(t * 1.5 + p.ph)) * .8 + .2);

  else { x.ellipse(0, 0, p.s * .55, p.s, 0, 0, 6.283); x.fill(); x.fillStyle = 'rgba(255,255,255,.35)'; x.beginPath(); x.ellipse(-p.s * .15, -p.s * .3, p.s * .18, p.s * .4, 0, 0, 6.283); x.fill(); }
  x.restore();
}
function ambFrame(now){
  if (!AMB.on) return;
  if (now - AMB.last < 14) { AMB.raf = requestAnimationFrame(ambFrame); return; }   // 60 images/s suffisent (économise la batterie sur les écrans 120 Hz)
  const cv = $('#seasonFx'), x = cv.getContext('2d'), dpr = Math.min(devicePixelRatio || 1, 1.5), W = cv.clientWidth, H = cv.clientHeight;
  if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) { cv.width = W * dpr; cv.height = H * dpr; }

  const N = {winter:70, autumn:16, spring:22, summer:26}[AMB.kind] || 0;
  while (AMB.P.length < N) AMB.P.push(ambSpawn(AMB.P.length < N * .9 && AMB.init, W, H));

    const lc = $('#clCv'), q = .5, lw = Math.round(W * q), lh = Math.round(H * q); if (lc.width !== lw || lc.height !== lh) { lc.width = lw; lc.height = lh; }

}
function ambStart(){

const ambPtr = e => { if (!AMB.candle || !AMB.on) return; const r = $('#scr-read').getBoundingClientRect(); AMB.tx = e.clientX - r.left; AMB.ty = e.clientY - r.top - 70; };

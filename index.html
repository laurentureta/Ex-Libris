<style>
:root{
  --paper:#F4EFE6; --surface:#FFFDF9; --ink:#1A1714; --ink2:#70685F; --rule:#E2DACD; --accent:#B5342A; --gold:#B08A43; --wall:rgba(120,88,58,.07);
  --rib:linear-gradient(90deg,#5E140F,#B5342A 30%,#E9806A 48%,#C23E30 62%,#5A130E);
  --foil:linear-gradient(100deg,#7A5A25,#C9A45C 22%,#F6E3A6 36%,#C9A45C 50%,#8A6A2F 66%,#E8CD8A 84%,#9A7834);
  --glass:rgba(255,255,255,.58); --glass-line:rgba(255,255,255,.8); --glass-hi:rgba(255,255,255,.45);
  --glass-shadow:0 10px 30px rgba(40,30,20,.10), 0 1px 2px rgba(40,30,20,.08);
  --edge-a:#F1EADC; --edge-b:#D9CFBC;
  --serif: ui-serif, "Iowan Old Style", "New York", Georgia, "Times New Roman", serif;
  --sans: -apple-system, BlinkMacSystemFont, system-ui, "Helvetica Neue", Arial, sans-serif;
  --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px);
  --tabH: 62px;
}
[data-theme=dark]{
  --paper:#0D0C0B; --surface:#171513; --ink:#EFE9DF; --ink2:#918879; --rule:#28241F; --accent:#E2604E; --gold:#D4AF67; --wall:rgba(255,236,210,.035);
  --glass:rgba(40,40,44,.55); --glass-line:rgba(255,255,255,.10); --glass-hi:rgba(255,255,255,.07);
  --glass-shadow:0 10px 30px rgba(0,0,0,.5);
  --edge-a:#CFC5B2; --edge-b:#A89D88;
}
*{box-sizing:border-box;margin:0;padding:0}
html{min-height:calc(100% + env(safe-area-inset-top,0px))}
html,body{height:100%;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;transition:background-color .35s ease,color .35s ease}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
#app{position:fixed;top:0;left:0;right:0;bottom:auto;height:var(--appH,100%);transform:translateZ(0);overflow:hidden;overflow:clip;background-color:var(--paper);background-image:var(--grain,none);background-size:180px 180px;transition:background-color .35s ease}
.amb{position:absolute;inset:-12%;pointer-events:none;will-change:opacity,transform;animation:breathe 17s ease-in-out infinite alternate}
#ambB{animation-delay:-8.5s}
@keyframes breathe{0%{transform:scale(1) translate3d(0,0,0)}50%{transform:scale(1.09) translate3d(2.5%,-2%,0)}100%{transform:scale(1.04) translate3d(-2.5%,2%,0)}}
@media (prefers-reduced-motion:reduce){.amb{animation:none}}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);box-shadow:inset 0 0 0 .5px var(--glass-line),inset 0 1px 0 var(--glass-hi),var(--glass-shadow)}

/* Écrans */
.screen{position:absolute;inset:0;padding-top:calc(var(--st) + 12px);opacity:0;visibility:hidden;transition:opacity .28s ease,visibility 0s .28s;touch-action:none}
.screen.active{opacity:1;visibility:visible;transition:opacity .28s ease}
.screen.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding-bottom:calc(var(--sb) + var(--tabH) + 110px)}
#scr-read{display:flex;flex-direction:column;padding-bottom:calc(var(--sb) + var(--tabH) + 84px)}
.top{padding:0 22px}
.kicker{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2);font-weight:600;display:flex;align-items:center;gap:7px}
.brand{color:var(--accent);display:inline-flex;align-items:center;gap:5px;font-weight:700;letter-spacing:.16em}
.brand svg{width:8px;height:11px;fill:currentColor}
.brand::after{content:"·";color:var(--ink2);margin-left:2px;letter-spacing:0}
.title-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:2px}
.list-title{font-family:var(--serif);font-weight:600;font-size:34px;letter-spacing:-.02em;line-height:1.12}
.list-title.swap{animation:capIn .32s cubic-bezier(.2,.8,.2,1) both}
.goal{font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
.goal b{color:var(--ink);font-weight:600}

/* Galerie */
.scene{flex:1;display:flex;flex-direction:column;min-height:0;position:relative;touch-action:none}
.stage{flex:1;position:relative;perspective:1100px;perspective-origin:50% 50%;min-height:0;transition:opacity .16s ease}
.stage.hide{opacity:0}
.empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink2)}
.empty-in h3{font-family:var(--serif);font-size:25px;font-weight:600;color:var(--ink);letter-spacing:-.01em;line-height:1.15;margin-top:6px}
.empty-in p{font-size:15px;line-height:1.45;max-width:290px;margin-top:-6px}
.empty-in>*{animation:cardIn .7s cubic-bezier(.2,.9,.25,1) both}
.empty-in>h3{animation-delay:.08s}.empty-in>p{animation-delay:.14s}.empty-in>.empty-btns{animation-delay:.2s}
.ghost-book{position:relative;width:112px;height:162px;border-radius:4px 6px 6px 4px;border:1.5px dashed color-mix(in srgb,var(--ink2) 60%,transparent);background:linear-gradient(135deg,rgba(176,138,67,.10),rgba(176,138,67,0) 60%);animation:gbFloat 4.5s ease-in-out infinite!important}
@keyframes gbFloat{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(1.5deg)}}
.ghost-book i{position:absolute;display:block}
.gb-spine{left:10px;top:8px;bottom:8px;width:1.5px;background:color-mix(in srgb,var(--ink2) 45%,transparent)}
.gb-rib{right:20px;top:-2px;width:12px;height:52px;background:var(--rib);clip-path:polygon(0 0,100% 0,100% 100%,50% 76%,0 100%);filter:drop-shadow(0 2px 2px rgba(0,0,0,.2))}
.gb-l1,.gb-l2{left:30px;right:30px;height:1.5px;background:color-mix(in srgb,var(--gold) 70%,transparent)}
.gb-l1{top:62px}.gb-l2{top:72px;left:42px;right:42px}
.gb-dia{left:50%;top:94px;width:7px;height:7px;margin-left:-3.5px;transform:rotate(45deg);background:var(--gold);opacity:.8}
.empty-btns{display:flex;flex-direction:column;align-items:center;gap:6px}
.btn-scan{display:flex;align-items:center;gap:9px;height:54px;padding:0 26px;border-radius:27px;background:var(--ink);color:var(--paper);font-weight:600;font-size:16px;box-shadow:0 12px 26px -12px rgba(0,0,0,.45);transition:transform .22s cubic-bezier(.3,1.6,.5,1)}
.btn-scan:active{transform:scale(.95)}
.btn-scan{position:relative;overflow:hidden}
.btn-scan::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-50%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.28),transparent);animation:shine 3.4s ease-in-out infinite 1.6s}
.btn-scan svg{width:20px;height:20px}
.btn-link{height:40px;padding:0 14px;font-size:15px;font-weight:600;color:var(--accent)}
.book{position:absolute;left:50%;top:50%;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;will-change:transform}
.face{position:absolute;top:0;height:100%;-webkit-backface-visibility:hidden;backface-visibility:hidden}
.front{left:0;width:100%;border-radius:3px;overflow:hidden;box-shadow:0 2px 4px rgba(0,0,0,.30),0 20px 34px -8px var(--tint,rgba(0,0,0,.3))}
.front canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.front .blur{opacity:0}
.front .dim{position:absolute;inset:0;background:#000;opacity:0}
.front .glare{position:absolute;top:0;bottom:0;left:-80%;width:260%;background:linear-gradient(100deg,rgba(255,255,255,0) 36%,rgba(255,255,255,.26) 47%,rgba(255,255,255,.07) 53%,rgba(255,255,255,0) 62%);pointer-events:none;will-change:transform,opacity}
.front .spot{position:absolute;left:0;top:0;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.36),rgba(255,255,255,0));opacity:0;pointer-events:none;will-change:transform,opacity}
.floor{position:absolute;left:50%;top:50%;border-radius:50%;background:radial-gradient(closest-side,rgba(40,24,12,.38),rgba(40,24,12,0));pointer-events:none;will-change:transform,opacity}
[data-theme=dark] .floor{background:radial-gradient(closest-side,rgba(0,0,0,.75),rgba(0,0,0,0))}
.spine{border-radius:2px 0 0 2px;background-image:linear-gradient(90deg,rgba(0,0,0,.42),rgba(255,255,255,.14) 35%,rgba(0,0,0,.18))}
.edge{background:linear-gradient(90deg,rgba(0,0,0,.14),rgba(0,0,0,0) 40%,rgba(0,0,0,.08)),repeating-linear-gradient(90deg,var(--edge-a) 0 1.3px,var(--edge-b) 1.3px 2px)}
.edge.gilt{background:linear-gradient(90deg,rgba(0,0,0,.22),rgba(0,0,0,0) 45%,rgba(0,0,0,.12)),repeating-linear-gradient(90deg,rgba(0,0,0,.08) 0 1px,transparent 1px 2px),linear-gradient(180deg,#7A5A25,#F3DFA2 22%,#B8914A 45%,#FBE9B5 68%,#8A6A2F)}
.back{border-radius:3px}
.capface{background:repeating-linear-gradient(0deg,var(--edge-a) 0 1.3px,var(--edge-b) 1.3px 2px)}

.caption{height:100px;position:relative;text-align:center;flex:none}
.cap{position:absolute;left:0;right:0;top:0;padding:0 22px}
.cap.in{animation:capIn .3s .06s cubic-bezier(.2,.8,.2,1) both}
.cap.out{animation:capOut .12s ease-in forwards}
@keyframes capIn{from{opacity:0;transform:translateY(6px)}}
@keyframes capOut{to{opacity:0;transform:translateY(-6px)}}
.cap-title{font-family:var(--serif);font-size:22px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cap-meta{margin-top:3px;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2);font-weight:600}
.prog{position:relative;height:1.5px;background:var(--rule);margin:13px auto 0;width:170px}
.prog>i{display:block;height:100%;background:var(--ink);transform-origin:0 50%}
.prog>b{position:absolute;left:0;top:-1px;width:9px;height:13px;margin-left:-4.5px;background:var(--rib);clip-path:polygon(0 0,100% 0,100% 100%,50% 74%,0 100%);transform:translateX(var(--x,0))}
.cap-title .w{display:inline-block;white-space:nowrap}
.cap-title .ch{display:inline-block;animation:inkIn .42s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i) * 11ms)}
@keyframes inkIn{from{opacity:0;filter:blur(5px);transform:translateY(4px)}}
.prog-text{margin-top:8px;font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}

/* Zone pouce */
.thumb{padding:4px 18px 0;flex:none}
.seg{position:relative;display:flex;height:40px;border-radius:20px;padding:3px}
.seg button{flex:1;position:relative;z-index:1;font-size:14px;font-weight:600;color:var(--ink2);transition:color .25s}
.seg button.on{color:var(--ink)}
.seg-ind{position:absolute;top:3px;bottom:3px;left:0;border-radius:17px;background:var(--surface);box-shadow:0 2px 8px rgba(0,0,0,.10);transition:transform .5s cubic-bezier(.3,1.35,.5,1),width .5s cubic-bezier(.3,1.35,.5,1)}
[data-theme=dark] .seg-ind{background:rgba(255,255,255,.14)}
.dial{position:relative;height:50px;margin-top:8px;overflow:hidden;touch-action:none;-webkit-mask-image:linear-gradient(90deg,transparent,#000 20%,#000 80%,transparent);mask-image:linear-gradient(90deg,transparent,#000 20%,#000 80%,transparent)}
.dial-track{position:absolute;left:0;top:6px;height:22px;will-change:transform;transition:opacity .25s}
.dial-track .small{position:absolute;left:0;right:0;bottom:0;height:9px;background:repeating-linear-gradient(90deg,var(--ink2) 0 1px,transparent 1px 8px);opacity:.6}
.dial-track .big{position:absolute;left:0;right:0;bottom:0;height:18px;background:repeating-linear-gradient(90deg,var(--ink) 0 1.5px,transparent 1.5px 40px);opacity:.55}
.dial-needle{position:absolute;left:50%;top:0;width:10px;height:31px;margin-left:-5px;background:var(--rib);clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%);transition:opacity .25s}
.dial-label{position:absolute;left:0;right:0;bottom:0;text-align:center;font-size:10.5px;color:var(--ink2);letter-spacing:.08em;text-transform:uppercase;font-weight:600;font-variant-numeric:tabular-nums}
.dial.off .dial-track,.dial.off .dial-needle{opacity:0}

/* Barre de session + onglets */
.session{position:fixed;left:14px;right:14px;bottom:calc(var(--sb) + var(--tabH) + 18px);height:56px;border-radius:28px;display:flex;align-items:center;gap:12px;padding:0 9px;z-index:40}
.session.add .ses-cover{display:none}
.session.add{padding-left:20px}
.scene.is-empty .caption{display:none}
.ghost-book{width:96px!important;height:138px!important}
.gb-l1{top:52px!important}.gb-l2{top:61px!important}.gb-dia{top:80px!important}
.ses-cover{width:28px;height:42px;border-radius:3px;background-size:cover;background-position:center;box-shadow:0 2px 6px rgba(0,0,0,.25);flex:none;margin-left:5px}
.ses-text{flex:1;min-width:0}
.ses-title{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ses-sub{font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ses-time{font-variant-numeric:tabular-nums;font-size:15px;font-weight:600;color:var(--accent)}
.ses-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--paper);flex:none}
.ses-btn svg{width:18px;height:18px}
.tabbar{overflow:hidden;position:fixed;left:14px;right:calc(14px + var(--tabH) + 10px);bottom:calc(var(--sb) + 8px);height:var(--tabH);border-radius:31px;display:flex;z-index:40;padding:0 6px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--ink2);transition:color .2s}
.tab svg{width:25px;height:25px}
.tab{position:relative}
.tab.on{color:var(--accent)}
.tab::before{content:"";position:absolute;top:0;left:50%;width:9px;height:12px;margin-left:-4.5px;background:var(--rib);clip-path:polygon(0 0,100% 0,100% 100%,50% 72%,0 100%);transform:translateY(-14px);transition:transform .45s cubic-bezier(.3,1.5,.5,1)}
.tab.on::before{transform:none}
.search-btn{position:fixed;right:14px;bottom:calc(var(--sb) + 8px);width:var(--tabH);height:var(--tabH);border-radius:50%;display:grid;place-items:center;z-index:40;color:var(--ink)}
.search-btn svg{width:24px;height:24px}

/* Bibliothèque */
#scr-lib{display:flex;flex-direction:column;padding-bottom:calc(var(--sb) + var(--tabH) + 84px)}
.shelves{flex:1;display:flex;flex-direction:column;justify-content:space-evenly;padding:4px 18px 0;min-height:0}
.shelf-head{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--serif);font-size:18px;font-weight:600;margin-bottom:2px}
.shelf-head .count{font-family:var(--sans);font-size:11.5px;color:var(--ink2);font-weight:600;letter-spacing:.07em;text-transform:uppercase}
.bay{position:relative;padding:0 10px;border-radius:5px 5px 0 0;background:linear-gradient(180deg,rgba(0,0,0,.08),rgba(0,0,0,0) 34%),var(--wall);box-shadow:inset 0 12px 16px -12px rgba(0,0,0,.28)}
.row{display:flex;align-items:flex-end;gap:2px;perspective:700px;touch-action:none;position:relative;padding:0 2px}
.shelf-empty{align-self:center;width:100%;text-align:center;color:var(--ink2);font-family:var(--serif);font-style:italic}
.plank{position:relative;height:17px;margin:0 -5px}
.plank i{position:absolute;display:block}
.plank .pt{left:3px;right:3px;top:0;height:6px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 3px,rgba(0,0,0,0) 3px 11px),linear-gradient(#A47C58,#86603F);clip-path:polygon(.8% 0,99.2% 0,100% 100%,0 100%)}
.plank .pf{left:0;right:0;top:6px;height:11px;border-radius:0 0 3px 3px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 2px,rgba(0,0,0,0) 2px 13px),linear-gradient(#6F4D33,#4A3121);box-shadow:0 8px 14px -6px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.2)}
[data-theme=dark] .plank .pt{background:repeating-linear-gradient(90deg,rgba(255,255,255,.04) 0 3px,rgba(0,0,0,0) 3px 11px),linear-gradient(#5E432E,#4A3424)}
[data-theme=dark] .plank .pf{background:linear-gradient(#3E2A1D,#2A1C13);box-shadow:0 8px 14px -6px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.1)}
.bookend{flex:none;align-self:flex-end;width:13px;height:58%;margin-left:8px;border-radius:4px 4px 0 0;background:linear-gradient(90deg,#6E5222,#E2C27C 38%,#B8914A 55%,#5E441A);box-shadow:4px 0 8px -3px rgba(0,0,0,.45)}
#scr-lib::before{content:"";position:absolute;left:-30%;right:-30%;top:-8%;height:55%;background:radial-gradient(50% 50% at 50% 0%,rgba(255,206,140,.20),rgba(255,206,140,0) 72%);pointer-events:none}
[data-theme=dark] #scr-lib::before{background:radial-gradient(50% 50% at 50% 0%,rgba(255,190,110,.13),rgba(255,190,110,0) 72%)}
.spine-el{position:relative;flex:none;border-radius:2px 2px 1px 1px;transform-origin:50% 100%;transition:transform .22s cubic-bezier(.2,.9,.3,1.25);display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:6px;padding:16px 0 11px;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.18),5px 0 9px -4px rgba(0,0,0,.35);overflow:hidden}
.band.foil{background:var(--foil)!important;opacity:1!important}
.sp-title.foil{background:linear-gradient(180deg,#8A6A2F,#F3DFA2 40%,#C9A45C 60%,#7A5A25);-webkit-background-clip:text;background-clip:text;color:transparent}
.spine-el::after,.spine-face::after{content:'';position:absolute;inset:0;border-radius:inherit;background:linear-gradient(90deg,rgba(0,0,0,.30),rgba(255,255,255,.16) 22%,rgba(255,255,255,0) 45%,rgba(0,0,0,.22));pointer-events:none}
.spine-face{display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:6px;padding:16px 0 11px;overflow:hidden;border-radius:2px}
.band{position:absolute;left:3px;right:3px;height:1.5px;opacity:.85;display:block}
.sp-title{writing-mode:vertical-rl;-webkit-writing-mode:vertical-rl;text-orientation:sideways;-webkit-text-orientation:sideways;transform:rotate(180deg);font-family:var(--serif);font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;min-height:0;line-height:1}
.sp-auth{writing-mode:vertical-rl;-webkit-writing-mode:vertical-rl;text-orientation:sideways;-webkit-text-orientation:sideways;transform:rotate(180deg);font-size:7px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.85;line-height:1;flex:none}
.spine-el.small .sp-title{font-size:10px}
.spine-el.settle{animation:settle .5s cubic-bezier(.3,1.5,.5,1)}
@keyframes settle{0%{transform:translateY(-14px)}100%{transform:none}}
.lib-hint{text-align:center;font-size:11.5px;color:var(--ink2);letter-spacing:.06em;text-transform:uppercase;font-weight:600;padding:10px 0 0}

/* Réglages */
.group{margin:22px 18px 0;border-radius:16px;background:var(--surface);overflow:hidden}
[data-theme=dark] .group{background:#161618}
.row-set{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 16px;border-top:.5px solid var(--rule);font-size:16px}
.row-set:first-child{border-top:0}
.row-set small{display:block;font-size:12.5px;color:var(--ink2);margin-top:3px;line-height:1.35}
.row-set input{flex:none;accent-color:var(--accent);transform:scale(1.15)}
.mini-seg{display:flex;background:var(--rule);border-radius:9px;padding:2px;flex:none}
.mini-seg button{padding:6px 10px;border-radius:7px;font-size:13px;font-weight:600;color:var(--ink2)}
.mini-seg button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.row-btn{width:100%;text-align:left;padding:14px 16px;font-size:16px;color:var(--accent)}
.about{margin:18px 24px 0;font-size:13px;line-height:1.5;color:var(--ink2)}
.about b{color:var(--ink);font-weight:600}

/* Fiche */
.detail{position:fixed;inset:0;z-index:50;visibility:hidden;opacity:0;pointer-events:none;touch-action:none}
.d-bg{position:absolute;inset:0;background:var(--paper)}
.d-amb{position:absolute;inset:-12%;pointer-events:none;transition:opacity .6s ease}
.d-inner{position:absolute;inset:0;display:flex;flex-direction:column;padding-top:calc(var(--st) + 6px);padding-bottom:calc(var(--sb) + 14px);will-change:transform;transform-origin:50% 0}
.d-grab{width:38px;height:5px;border-radius:3px;background:var(--ink2);opacity:.35;margin:4px auto 0;flex:none}
.d-stage{position:relative;flex:0 0 51%;min-height:0}
#gl{position:absolute;inset:0;width:100%;height:100%;transition:opacity .12s}
.d-shadow{position:absolute;border-radius:3px;box-shadow:0 2px 5px rgba(0,0,0,.25),0 28px 46px -10px var(--tint,rgba(0,0,0,.3));background:transparent}
.d-fallback{position:absolute;display:none;border-radius:3px;overflow:hidden;transition:opacity .15s}
.d-fallback canvas{width:100%;height:100%;display:block}
.seal{position:absolute;width:112px;height:112px;pointer-events:none;opacity:0;color:var(--accent)}
.seal svg{width:100%;height:100%;display:block}
.seal.static{opacity:1;transform:rotate(-14deg)}
.seal.on{animation:stamp .6s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes stamp{0%{opacity:0;transform:scale(1.6) rotate(-4deg)}35%{opacity:1}100%{opacity:1;transform:scale(1) rotate(-14deg)}}
.d-info{flex:1;padding:4px 26px 0;text-align:center;min-height:0;overflow:hidden}
.d-kicker{font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.d-title{font-family:var(--serif);font-weight:600;font-size:29px;line-height:1.1;letter-spacing:-.02em;margin-top:6px}
.d-title .w{display:inline-block;white-space:nowrap}
.d-title .ch{display:inline-block;opacity:0;filter:blur(6px);transform:translateY(5px);animation:ink .62s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(var(--i) * 18ms + 60ms)}
@keyframes ink{to{opacity:1;filter:blur(0);transform:none}}
.d-meta{margin-top:7px;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2);font-weight:600}
.d-pitch{font-family:var(--serif);font-style:italic;font-size:16px;line-height:1.42;color:var(--ink2);margin:12px auto 0;max-width:340px}
.d-hint{font-size:11.5px;color:var(--ink2);margin-top:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;transition:opacity .4s}
.d-info .fade,.d-actions{transition:opacity .35s ease,transform .45s cubic-bezier(.2,.8,.2,1)}
.detail:not(.show) .d-info .fade,.detail:not(.show) .d-actions{opacity:0;transform:translateY(14px)}
.detail:not(.show) .d-title,.detail:not(.show) .seal{visibility:hidden}
.d-actions{display:flex;gap:12px;padding:0 18px;align-items:center;flex:none}
.round{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;flex:none}
.round svg{width:22px;height:22px}
.primary{flex:1;height:56px;border-radius:28px;background:var(--ink);color:var(--paper);font-weight:600;font-size:16px;transition:transform .15s}
.primary:active{transform:scale(.97)}

#flyLayer{position:fixed;inset:0;pointer-events:none;z-index:60;perspective:1000px}
.fly3d{position:absolute;left:0;top:0;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;transform-origin:0 50%;will-change:transform}
.fly2d{position:absolute;left:0;top:0;transform-origin:0 0;border-radius:3px;overflow:hidden;will-change:transform;box-shadow:0 2px 5px rgba(0,0,0,.25),0 24px 40px -10px var(--tint,rgba(0,0,0,.3))}
.fly2d canvas{width:100%;height:100%;display:block}
.toast{position:fixed;left:50%;top:calc(var(--st) + 10px);transform:translate(-50%,-160%);opacity:0;padding:11px 18px;border-radius:22px;font-size:14px;font-weight:600;z-index:90;transition:transform .5s cubic-bezier(.3,1.3,.5,1),opacity .3s;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.on{transform:translate(-50%,0);opacity:1}
.hap{position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;pointer-events:none;overflow:hidden}

/* ───── Écran de chargement : le grimoire ───── */
#splash{position:fixed;top:0;left:0;right:0;bottom:auto;height:var(--appH,100%);z-index:200;overflow:hidden;color:#EFE3C8;-webkit-user-select:none;user-select:none;background:#07060A}
#splash.gone{pointer-events:none}
.ld-bg{position:absolute;inset:0;background:radial-gradient(70% 45% at 50% 34%,#2B2030 0%,#140F18 45%,#07060A 100%)}
.ld-bg::before{content:"";position:absolute;left:50%;top:-10%;width:90vw;height:70%;margin-left:-45vw;background:linear-gradient(180deg,rgba(255,214,150,.11),rgba(255,214,150,0));clip-path:polygon(38% 0,62% 0,100% 100%,0 100%);filter:blur(18px);animation:ldBeam 5s ease-in-out infinite alternate}
.ld-bg::after{content:"";position:absolute;inset:0;background-image:var(--grain,none);background-size:180px;opacity:.7}
@keyframes ldBeam{to{opacity:.55;transform:scaleX(1.12)}}
.ld-rays{position:absolute;left:50%;top:32%;width:190vmax;height:190vmax;margin:-95vmax 0 0 -95vmax;background:repeating-conic-gradient(from 0deg,rgba(255,214,140,.2) 0deg 2.2deg,rgba(255,214,140,0) 2.2deg 12deg);-webkit-mask-image:radial-gradient(circle,#000 0%,rgba(0,0,0,.4) 18%,transparent 42%);mask-image:radial-gradient(circle,#000 0%,rgba(0,0,0,.4) 18%,transparent 42%);opacity:0;animation:ldSpin 48s linear infinite}
@keyframes ldSpin{to{rotate:360deg}}
.ld-gshadow{position:absolute;left:50%;top:calc(32% + var(--ph) * .5);width:calc(var(--pw) * 2.5);height:calc(var(--pw) * .42);margin-left:calc(var(--pw) * -1.25);background:radial-gradient(closest-side,rgba(0,0,0,.85),rgba(0,0,0,0));animation:ldShadow 3.6s ease-in-out infinite}
@keyframes ldShadow{50%{transform:scale(.86);opacity:.7}}
.ld-scene{position:absolute;left:0;right:0;top:0;height:64%;perspective:1100px;perspective-origin:50% 30%;display:flex;align-items:center;justify-content:center}
.ld-float{transform-style:preserve-3d;-webkit-transform-style:preserve-3d;animation:ldBob 3.6s ease-in-out infinite}
@keyframes ldBob{50%{transform:translate3d(0,-10px,0)}}
.ld-book{position:relative;width:calc(var(--pw) * 2);height:var(--ph);transform-style:preserve-3d;-webkit-transform-style:preserve-3d;transform:rotateX(36deg)}
.ld-book>*{position:absolute}
.ld-board{left:var(--pw);top:-8px;width:calc(var(--pw) + 9px);height:calc(var(--ph) + 16px);border-radius:0 5px 5px 0;background:linear-gradient(90deg,#3A0F0B,#6E1E16 30%,#4A1410);box-shadow:inset 0 0 0 1.5px rgba(212,175,103,.5),0 2px 0 #24080A;transform:translateZ(-6px)}
.ld-stack{top:0;width:var(--pw);height:var(--ph);transform:translateZ(-1px)}
.ld-left{left:0;border-radius:3px 0 0 3px;box-shadow:-1px 1px 0 #E3D7C2,-2px 2px 0 #CDBFA6,-3px 3px 0 #E3D7C2,-4px 4px 0 #C7B89D;opacity:0}
.ld-right{left:var(--pw);border-radius:0 3px 3px 0;box-shadow:1px 1px 0 #E3D7C2,2px 2px 0 #CDBFA6,3px 3px 0 #E3D7C2,4px 4px 0 #C7B89D,5px 5px 0 #DCCFB7}
.ld-rib{left:calc(var(--pw) + 18px);top:-4px;width:11px;height:calc(var(--ph) + 34px);background:var(--rib);clip-path:polygon(0 0,100% 0,100% 100%,50% calc(100% - 7px),0 100%);transform:translateZ(.2px)}
#ldLeaves{left:0;top:0;width:100%;height:100%;transform-style:preserve-3d;-webkit-transform-style:preserve-3d}
.ld-leaf{position:absolute;left:var(--pw);top:0;height:var(--ph);width:0;transform-origin:0 50%;transform-style:preserve-3d;-webkit-transform-style:preserve-3d}
.ld-seg{position:absolute;left:0;top:0;height:100%;transform-origin:0 50%;transform-style:preserve-3d;-webkit-transform-style:preserve-3d}
.ld-f,.ld-b{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;background-repeat:no-repeat}
.ld-b{transform:rotateY(180deg)}
.ld-f i,.ld-b i{position:absolute;inset:0;background:#000;opacity:0}
.ld-front{left:var(--pw);top:-8px;width:calc(var(--pw) + 9px);height:calc(var(--ph) + 16px);transform-origin:0 50%;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;transform:rotateY(0deg) translateZ(3px)}
.ld-fo,.ld-fi{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;border-radius:0 5px 5px 0}
.ld-fo{background:radial-gradient(120% 80% at 30% 20%,#7A2219,#4A1410 55%,#2E0B08);box-shadow:inset 0 0 0 1px rgba(0,0,0,.4),inset 6px 0 10px -4px rgba(0,0,0,.6)}
.ld-fo::after{content:"";position:absolute;inset:0;border-radius:inherit;background-image:var(--grain,none);background-size:120px;opacity:.6;mix-blend-mode:overlay}
.ld-fo svg{position:absolute;inset:0;width:100%;height:100%}
.ld-fi{transform:rotateY(180deg);border-radius:5px 0 0 5px;background:repeating-radial-gradient(circle at 30% 35%,#4A1410 0 5px,#6A2018 5px 8px,#8A6A2F 8px 9px,#4A1410 9px 13px),#4A1410;box-shadow:inset 0 0 0 5px #3A0F0B,inset 0 0 0 6px rgba(212,175,103,.6)}
.ld-halo{position:absolute;left:50%;top:32%;width:150vw;height:90vw;margin:-45vw 0 0 -75vw;border-radius:50%;background:radial-gradient(closest-side,rgba(255,226,160,.55),rgba(255,190,100,.18) 45%,rgba(255,190,100,0));mix-blend-mode:screen;opacity:0;pointer-events:none}
.ld-ui{position:absolute;left:0;right:0;top:61%;display:flex;flex-direction:column;align-items:center}
.ld-title{width:min(70vw,270px);overflow:visible;filter:drop-shadow(0 0 8px rgba(255,200,120,.45))}
#ldTitle{font-family:var(--serif);font-style:italic;font-weight:600;font-size:72px;fill:url(#ldGold);fill-opacity:0;stroke:#F3DFA2;stroke-width:1;stroke-dasharray:320;stroke-dashoffset:320;stroke-linejoin:round}
.ld-thread{position:relative;width:min(58vw,220px);height:1.5px;margin-top:12px;background:linear-gradient(90deg,rgba(212,175,103,0),rgba(212,175,103,.28) 15%,rgba(212,175,103,.28) 85%,rgba(212,175,103,0))}
.ld-thread i{position:absolute;left:0;top:0;bottom:0;width:100%;background:linear-gradient(90deg,rgba(243,223,162,0),#F3DFA2 30%,#FFF6D8);transform-origin:0 50%;transform:scaleX(var(--lp,0));box-shadow:0 0 8px rgba(255,214,140,.8)}
.ld-thread b{position:absolute;top:50%;left:0;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:radial-gradient(closest-side,#FFF8E1,rgba(255,226,160,.7) 30%,rgba(255,200,120,0));transform:translateX(calc(var(--lp,0) * min(58vw,220px)))}
.ld-msg{display:flex;gap:10px;justify-content:center;margin-top:14px;font-family:var(--serif);font-style:italic;font-size:15px;color:rgba(236,218,176,.75);min-height:20px}
#ldMsg{transition:opacity .3s}
#ldPct{font-family:var(--sans);font-style:normal;font-size:11px;letter-spacing:.12em;color:rgba(212,175,103,.6);font-variant-numeric:tabular-nums;padding-top:3px}
.ld-page{position:absolute;inset:0;visibility:hidden;opacity:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:8vh;transform-origin:50% 46%}
#ldPaperCv{position:absolute;inset:0;width:100%;height:100%}
.ld-page>svg,.ld-page>.ld-ptag{position:relative}
.ld-ink{width:min(84vw,340px);overflow:visible;filter:drop-shadow(0 0 5px rgba(240,190,90,.45))}
.ld-ink .ink{fill:none;stroke:#7A5A25;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:var(--len,400);stroke-dashoffset:var(--len,400)}
.ld-ink .ink-t{font-family:var(--serif);font-style:italic;font-weight:600;font-size:76px;fill:#5A3E14;fill-opacity:0;stroke:#5A3E14;stroke-width:.9;--len:330}
.ld-page.ink .ink{animation:inkDraw .85s cubic-bezier(.45,0,.2,1) var(--dl,0s) forwards}
.ld-page.ink .ink-t{animation:inkDraw .9s cubic-bezier(.45,0,.2,1) var(--dl,0s) forwards,inkFill .45s ease .7s forwards}
@keyframes inkDraw{to{stroke-dashoffset:0}}
@keyframes inkFill{to{fill-opacity:1}}
.ld-ptag{font-family:var(--serif);font-style:italic;font-size:19px;color:#6E5A3C;opacity:0;transform:translateY(6px);margin-top:4px}
.ld-page.ink .ld-ptag{animation:ldRise .6s ease .65s forwards}
@keyframes ldRise{to{opacity:1;transform:none}}
.ld-flash{position:absolute;inset:0;background:radial-gradient(circle at var(--bx,50%) var(--by,32%),#FFFBF0 0%,#F7EFDF 34%,rgba(246,238,221,.9) 50%,rgba(246,238,221,0) 70%);opacity:0;pointer-events:none}
#ldDust{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#splash.fade{transition:opacity .4s ease;opacity:0}

/* ───── Finitions générales ───── */
.screen{transform:translate3d(0,10px,0) scale(.988);transition:opacity .32s ease,visibility 0s .32s,transform .5s cubic-bezier(.2,.9,.25,1)}
.screen.active{transform:none;transition:opacity .32s ease,transform .5s cubic-bezier(.2,.9,.25,1)}
.round,.ghost,.pill,.tab,.row-btn,.res,.round-s,.chip,.goal,.stepper button,.mini-seg button,.seg button,.card-lists button{transition:transform .22s cubic-bezier(.3,1.6,.5,1),background-color .2s,color .2s,opacity .2s}
.round:active,.ghost:active,.pill:active,.tab:active,.round-s:active,.chip:active,.goal:active,.stepper button:active{transform:scale(.92)}
.row-btn:active,.res:active,.row-link:active{background:rgba(127,127,127,.12)}
.goal{background:none;padding:4px 0 4px 8px}
.goal b{color:var(--accent)!important}
.round{position:relative;width:52px;height:52px}
.badge{position:absolute;top:8px;right:8px;min-width:8px;height:8px;border-radius:4px;background:var(--accent);display:none;box-shadow:0 0 0 2px var(--paper)}
.badge.on{display:block}
.d-actions{gap:10px!important}
.tab{font-size:10px!important}
.round-s{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--ink)}
.round-s svg{width:18px;height:18px}
.group-title{margin:24px 34px -14px;font-size:12px;letter-spacing:.09em;text-transform:uppercase;font-weight:600;color:var(--ink2)}
.row-link{width:100%;text-align:left;background:none;font-size:16px}
.row-link b{font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}
.row-btn.danger{color:#C0392B}
[data-theme=dark] .row-btn.danger{color:#FF6B5B}
.group .row-btn+.row-btn{border-top:.5px solid var(--rule)}

/* Recherche dans la bibliothèque */
.lib-search{display:flex;align-items:center;gap:8px;height:0;opacity:0;overflow:hidden;margin-top:0;border-radius:20px;padding:0 6px 0 12px;background:var(--surface);box-shadow:inset 0 0 0 .5px var(--rule);transition:height .4s cubic-bezier(.2,.9,.25,1),opacity .3s,margin .4s}
#scr-lib.searching .lib-search{height:40px;opacity:1;margin-top:10px}
.lib-search svg{width:17px;height:17px;color:var(--ink2);flex:none}
.lib-search input{flex:1;min-width:0;border:0;background:transparent;font-size:16px;outline:none;-webkit-appearance:none;appearance:none}
.lib-search span{font-size:12px;color:var(--ink2);white-space:nowrap;font-variant-numeric:tabular-nums}
.lib-search button{font-size:15px;font-weight:600;color:var(--accent);padding:0 6px}
.spine-el.dim{opacity:.16;filter:saturate(.25)}
.spine-el.hit{transform:translateY(-10px);box-shadow:inset 0 0 0 .5px rgba(0,0,0,.18),0 0 0 1.5px var(--gold),0 10px 18px -6px rgba(176,138,67,.7)}
.spine-el{transition:transform .22s cubic-bezier(.2,.9,.3,1.25),opacity .3s,filter .3s,box-shadow .3s}

/* Étoiles */
.stars{display:inline-flex;gap:calc(var(--s) * .14);touch-action:none;cursor:pointer;-webkit-user-select:none;user-select:none;padding:4px 0}
.st{position:relative;width:var(--s);height:var(--s);display:block}
.st svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.st .o{fill:none;stroke:var(--ink2);stroke-width:1.4;opacity:.55}
.st .f{fill:var(--gold);stroke:var(--gold);stroke-width:1.2;stroke-linejoin:round}
.st.pop{animation:starPop .45s cubic-bezier(.3,1.8,.5,1)}
@keyframes starPop{0%{transform:scale(1)}40%{transform:scale(1.35) rotate(-8deg)}100%{transform:scale(1)}}
.d-stars{height:32px;margin-top:4px;display:flex;justify-content:center;align-items:center}
.d-stars .stars{--s:21px}
.d-stars.off{display:none}

/* Toast */
.toast{display:flex;align-items:center;gap:10px;padding:10px 10px 10px 14px!important;min-height:44px}
.toast .t-ic{width:20px;height:20px;flex:none;display:none;color:var(--accent)}
.toast .t-ic.on{display:block}
.toast .t-ic svg{width:100%;height:100%}
.toast .t-msg{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:4px}
.toast .t-act{display:none;flex:none;height:30px;padding:0 12px;border-radius:15px;background:var(--ink);color:var(--paper);font-weight:700;font-size:13px}
.toast .t-act.on{display:block}

/* Poussière (suppression) */
#dust{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:66;display:none}

/* Feuilles (sheets) */
.sheet-wrap{position:fixed;inset:0;z-index:80;visibility:hidden;touch-action:none}
.sheet-wrap.on{visibility:visible}
.sheet-bd{position:absolute;inset:0;background:rgba(10,8,6,.42);opacity:0;transition:opacity .35s ease;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.sheet-wrap.on .sheet-bd{opacity:1}
.sheet{position:absolute;left:8px;right:8px;bottom:calc(var(--sb) + 8px);max-height:calc(100% - var(--st) - 40px);display:flex;flex-direction:column;border-radius:30px;background:var(--paper);background-image:var(--grain,none);background-size:180px;box-shadow:0 -12px 50px rgba(0,0,0,.35),inset 0 0 0 .5px rgba(255,255,255,.08);transform:translate3d(0,calc(100% + 40px),0);transition:transform .55s cubic-bezier(.2,.95,.25,1.04);will-change:transform}
.sheet-wrap.on .sheet{transform:none}
.sheet.drag{transition:none}
.sheet-grab{height:24px;flex:none;display:flex;justify-content:center;align-items:center;touch-action:none}
.sheet-grab i{width:38px;height:5px;border-radius:3px;background:var(--ink2);opacity:.35}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 20px 18px;touch-action:pan-y;transition:opacity .2s}
.sheet-body.swap{opacity:0}
.sh-kicker{font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);text-align:center}
.sh-title{font-family:var(--serif);font-size:24px;font-weight:600;letter-spacing:-.01em;line-height:1.15;text-align:center;margin-top:5px}
.sh-sub{font-size:14px;color:var(--ink2);text-align:center;margin-top:4px}
.sh-text{font-size:15.5px;line-height:1.45;color:var(--ink2);text-align:center;margin:10px 6px 0}
.sh-actions{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.sh-actions button{height:54px;border-radius:27px;font-size:16px;font-weight:600}
.btn-danger{background:#C0392B;color:#fff}
[data-theme=dark] .btn-danger{background:#E2604E}
.btn-plain{background:var(--rule);color:var(--ink)}
.btn-main{background:var(--ink);color:var(--paper)}
.sh-sec{margin-top:22px}
.sh-sec h4{font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--ink2);margin:0 2px 9px;display:flex;justify-content:space-between}
.sh-sec h4 span{color:var(--accent)}
.sh-stars{display:flex;justify-content:center;flex-direction:column;align-items:center;gap:4px}
.sh-stars .stars{--s:36px}
.sh-stars small{font-size:13px;color:var(--ink2);height:16px}
.field{width:100%;border:0;border-radius:16px;background:var(--surface);box-shadow:inset 0 0 0 .5px var(--rule);padding:12px 14px;font-size:16px;line-height:1.4;outline:none;resize:none;-webkit-appearance:none;appearance:none}
textarea.field{min-height:92px;font-family:var(--serif);font-size:17px}
.field:focus{box-shadow:inset 0 0 0 1.5px var(--gold)}
.dates{display:flex;gap:10px}
.dates label{flex:1;display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink2)}
.dates input{height:44px;padding:0 10px;font-size:15px}
.quote{position:relative;padding:14px 40px 12px 30px;border-radius:16px;background:var(--surface);box-shadow:inset 0 0 0 .5px var(--rule);margin-bottom:10px;font-family:var(--serif);font-style:italic;font-size:17px;line-height:1.42;animation:qIn .45s cubic-bezier(.2,.9,.25,1.1) both}
.quote::before{content:"“";position:absolute;left:10px;top:2px;font-size:38px;line-height:1;color:var(--gold);font-style:normal}
.quote small{display:block;font-family:var(--sans);font-style:normal;font-size:12px;color:var(--ink2);margin-top:6px;letter-spacing:.04em}
.quote button{position:absolute;right:8px;top:8px;width:28px;height:28px;border-radius:50%;color:var(--ink2);font-size:18px;line-height:1}
.quote.out{animation:qOut .35s ease forwards}
@keyframes qIn{from{opacity:0;transform:translateY(10px) scale(.97)}}
@keyframes qOut{to{opacity:0;transform:translateX(40px);height:0;padding:0;margin:0}}
.q-add{display:flex;gap:8px;align-items:flex-end}
.q-add textarea{flex:1;min-height:48px!important;font-style:italic;font-size:16px!important;padding:13px 14px}
.q-add input{width:62px;height:48px;text-align:center}
.q-add button{height:48px;padding:0 14px;border-radius:16px;background:var(--ink);color:var(--paper);font-weight:600;font-size:14px}
.q-empty{font-size:14px;color:var(--ink2);font-style:italic;font-family:var(--serif);margin:0 2px 10px}
.danger-row{width:100%;height:50px;margin-top:24px;border-radius:16px;color:#C0392B;font-weight:600;font-size:15.5px;background:rgba(192,57,43,.08)}
[data-theme=dark] .danger-row{color:#FF6B5B;background:rgba(255,107,91,.1)}
.big-num{font-family:var(--serif);font-weight:600;font-size:64px;line-height:1;text-align:center;font-variant-numeric:tabular-nums;margin-top:14px;letter-spacing:-.02em}
.big-num input{width:100%;border:0;background:transparent;text-align:center;font:inherit;color:inherit;outline:none;-webkit-appearance:none;appearance:none}
.big-sub{text-align:center;font-size:13px;color:var(--ink2);margin-top:2px}
.stepper{display:flex;justify-content:center;gap:10px;margin-top:16px;flex-wrap:wrap}
.stepper button,.chip{height:40px;min-width:56px;padding:0 14px;border-radius:20px;background:var(--rule);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
.year-prev{display:block;width:62%;margin:14px auto 0;border-radius:14px;box-shadow:0 18px 40px -12px rgba(0,0,0,.55);animation:qIn .6s cubic-bezier(.2,.9,.25,1.1) both}

/* Bilan */
#statsBody{padding:6px 16px 0}
.card-st{position:relative;border-radius:24px;background:var(--surface);box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 10px 30px -18px rgba(60,40,20,.35),inset 0 0 0 .5px var(--rule);padding:18px;margin-top:14px;overflow:hidden;animation:cardIn .6s cubic-bezier(.2,.9,.25,1) both;animation-delay:calc(var(--d,0) * 70ms)}
[data-theme=dark] .card-st{background:#171513;box-shadow:inset 0 0 0 .5px var(--rule)}
@keyframes cardIn{from{opacity:0;transform:translateY(18px)}}
.card-st h3{font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--ink2);display:flex;justify-content:space-between;align-items:center}
.card-st h3 button{font-size:13px;letter-spacing:0;text-transform:none;color:var(--accent);font-weight:600}
.goal-card{display:flex;align-items:center;gap:18px}
.ring{position:relative;width:118px;height:118px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .tr{fill:none;stroke:var(--rule);stroke-width:9}
.ring .pr{fill:none;stroke:url(#ringGrad);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1)}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .in b{font-family:var(--serif);font-size:34px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.ring .in small{font-size:11.5px;color:var(--ink2);margin-top:3px}
.goal-txt h4{font-family:var(--serif);font-size:21px;font-weight:600;line-height:1.2}
.goal-txt p{font-size:14px;color:var(--ink2);margin-top:6px;line-height:1.4}
.goal-txt .chip{margin-top:12px;height:34px;font-size:13.5px;background:var(--rule)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.tile{border-radius:20px;background:var(--surface);box-shadow:inset 0 0 0 .5px var(--rule);padding:15px 15px 13px;animation:cardIn .6s cubic-bezier(.2,.9,.25,1) both;animation-delay:calc(var(--d,0) * 70ms)}
[data-theme=dark] .tile{background:#171513}
.tile b{display:block;font-family:var(--serif);font-size:30px;font-weight:600;line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.tile b small{font-size:16px;color:var(--gold);margin-left:2px}
.tile span{display:block;font-size:12.5px;color:var(--ink2);margin-top:5px}
.streak-top{display:flex;align-items:baseline;gap:10px;margin-top:10px}
.streak-top b{font-family:var(--serif);font-size:40px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.streak-top span{font-size:15px;color:var(--ink2)}
.streak-top em{margin-left:auto;font-style:normal;font-size:13px;color:var(--ink2)}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;margin-top:14px}
.heat i{display:block;aspect-ratio:1;border-radius:3px;background:var(--rule);animation:hIn .5s cubic-bezier(.3,1.5,.5,1) both;animation-delay:calc(var(--w) * 22ms + 150ms)}
.heat i.l1,.heat-leg i.l1{background:rgba(181,52,42,.25)}.heat i.l2,.heat-leg i.l2{background:rgba(181,52,42,.48)}.heat i.l3,.heat-leg i.l3{background:rgba(181,52,42,.72)}.heat i.l4,.heat-leg i.l4{background:#B5342A}
[data-theme=dark] .heat i.l1,[data-theme=dark] .heat-leg i.l1{background:rgba(226,96,78,.25)}[data-theme=dark] .heat i.l2,[data-theme=dark] .heat-leg i.l2{background:rgba(226,96,78,.48)}[data-theme=dark] .heat i.l3,[data-theme=dark] .heat-leg i.l3{background:rgba(226,96,78,.72)}[data-theme=dark] .heat i.l4,[data-theme=dark] .heat-leg i.l4{background:#E2604E}
.heat i.today{box-shadow:0 0 0 1.5px var(--gold)}
.heat i.fut{visibility:hidden}
@keyframes hIn{from{transform:scale(0);opacity:0}}
.heat-leg{display:flex;justify-content:flex-end;align-items:center;gap:4px;margin-top:8px;font-size:11px;color:var(--ink2)}
.heat-leg i{width:10px;height:10px;border-radius:2px;display:block}
.bars{display:flex;align-items:flex-end;gap:6px;height:120px;margin-top:28px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px}
.bar i{display:block;width:100%;border-radius:6px 6px 3px 3px;background:var(--rule);transform-origin:50% 100%;animation:barIn .9s cubic-bezier(.2,.9,.25,1.1) both;animation-delay:calc(var(--k) * 45ms + 200ms);min-height:3px;position:relative}
.bar i.v{background:linear-gradient(180deg,var(--gold),#8A6A2F)}
.bar i.cur{background:var(--rib)}
.bar i em{position:absolute;top:-17px;left:0;right:0;text-align:center;font-style:normal;font-size:11px;font-weight:700;color:var(--ink2)}
.bar span{font-size:10.5px;color:var(--ink2);font-weight:600;text-transform:uppercase}
@keyframes barIn{from{transform:scaleY(0)}}
.authors{margin-top:10px}
.au{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:.5px solid var(--rule)}
.au:first-child{border-top:0}
.au em{font-family:var(--serif);font-style:italic;font-size:20px;color:var(--gold);width:18px}
.au div{flex:1;min-width:0}
.au b{font-weight:600;font-size:15.5px;display:block}
.au i{display:block;height:4px;border-radius:2px;background:var(--rule);margin-top:6px;overflow:hidden}
.au i::after{content:"";display:block;height:100%;width:var(--w);background:var(--rib);border-radius:2px;animation:wIn 1s cubic-bezier(.2,.9,.25,1) both .3s}
@keyframes wIn{from{width:0}}
.au span{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.st-empty{text-align:center;font-family:var(--serif);font-style:italic;font-size:16px;color:var(--ink2);margin:22px 20px 0;line-height:1.45}
.share-cta{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:58px;border-radius:29px;margin-top:18px;background:var(--ink);color:var(--paper);font-weight:600;font-size:16px;position:relative;overflow:hidden}
.share-cta::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-50%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.25),transparent);animation:shine 3.2s ease-in-out infinite 1s}
@keyframes shine{0%{left:-50%}45%,100%{left:120%}}
.share-cta svg{width:19px;height:19px}
.share-cta:active{transform:scale(.97)}
.fav{display:flex;gap:14px;align-items:center;margin-top:12px}
.fav canvas{width:58px;height:87px;border-radius:3px;box-shadow:0 8px 16px -6px rgba(0,0,0,.4);flex:none}
.fav b{font-family:var(--serif);font-size:18px;font-weight:600;display:block;line-height:1.2}
.fav span{font-size:13px;color:var(--ink2)}
.sheet-wrap{transition:visibility 0s .55s}
.sheet-wrap.on{transition:none}
[hidden]{display:none!important}
.scanner.nocam #scManual{display:none}
input,textarea{-webkit-user-select:text;user-select:text;font:inherit;color:inherit}
.empty-in{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;padding:0 30px}
.ghost{height:50px;padding:0 20px;border-radius:25px;font-weight:600;font-size:15px;color:var(--ink);background:var(--rule);font-style:normal;font-family:var(--sans)}
.round.trash{color:var(--ink2)}

/* Scanner */
.scanner{position:fixed;inset:0;z-index:55;background:#000;visibility:hidden;opacity:0;touch-action:none;color:#fff;overflow:hidden}
.scanner video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sc-mask{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding-bottom:12vh;pointer-events:none}
.sc-frame{position:relative;width:min(80vw,330px);aspect-ratio:1.45;border-radius:26px;box-shadow:0 0 0 200vmax rgba(0,0,0,.5);transition:transform .45s cubic-bezier(.3,1.4,.5,1)}
.scanner.opening .sc-frame{transform:scale(1.12)}
.sc-frame .c{position:absolute;width:36px;height:36px;border:3.5px solid #fff;transition:border-color .2s}
.sc-frame .tl{left:-2px;top:-2px;border-right:0;border-bottom:0;border-top-left-radius:26px}
.sc-frame .tr{right:-2px;top:-2px;border-left:0;border-bottom:0;border-top-right-radius:26px}
.sc-frame .bl{left:-2px;bottom:-2px;border-right:0;border-top:0;border-bottom-left-radius:26px}
.sc-frame .br{right:-2px;bottom:-2px;border-left:0;border-top:0;border-bottom-right-radius:26px}
.sc-line{position:absolute;left:9%;right:9%;height:2px;top:14%;border-radius:2px;background:#E0785A;box-shadow:0 0 14px 3px rgba(224,120,90,.7);animation:scanline 2.1s ease-in-out infinite alternate}
@keyframes scanline{to{top:86%}}
.scanner.hit .c{border-color:#E0785A}
.scanner.hit .sc-line{opacity:0}
.scanner.hit .sc-frame{transform:scale(.96)}
.sc-hit{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.sc-hit polygon{fill:rgba(224,120,90,.22);stroke:#E0785A;stroke-width:3;stroke-linejoin:round;opacity:0;transition:opacity .2s}
.scanner.hit .sc-hit polygon{opacity:1}
.sc-top{position:absolute;left:0;right:0;top:calc(var(--st) + 22px);text-align:center;padding:0 30px;text-shadow:0 1px 10px rgba(0,0,0,.45);pointer-events:none}
.sc-title{font-family:var(--serif);font-size:25px;font-weight:600;letter-spacing:-.01em}
.sc-sub{font-size:14px;opacity:.88;margin-top:5px}
.dglass{background:rgba(30,30,32,.5);-webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.2),inset 0 1px 0 rgba(255,255,255,.12)}
.sc-status{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 104px);padding:9px 16px;border-radius:20px;font-size:13.5px;font-weight:600;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis;transition:opacity .25s;pointer-events:none;font-variant-numeric:tabular-nums}
.sc-bar{position:absolute;left:0;right:0;bottom:calc(var(--sb) + 22px);display:flex;align-items:center;justify-content:center;gap:12px;padding:0 18px}
.sc-bar .round{color:#fff}
.sc-bar .round.on{background:#fff;color:#111}
.pill{height:56px;border-radius:28px;padding:0 22px;font-weight:600;font-size:15px;color:#fff;display:flex;align-items:center;gap:8px;white-space:nowrap}
.pill svg{width:19px;height:19px}
.sc-nocam{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:0 36px 12vh;text-align:center}
.sc-nocam p{font-size:16px;line-height:1.45;opacity:.9}
.sc-nocam svg{width:44px;height:44px;opacity:.8}
.scanner.nocam .sc-mask,.scanner.nocam .sc-top,.scanner.nocam .sc-status{display:none}
.scanner.nocam .sc-nocam{display:flex}
.sc-search{position:absolute;inset:0;background:var(--paper);color:var(--ink);padding:calc(var(--st) + 14px) 16px calc(var(--sb) + 12px);display:flex;flex-direction:column;transform:translateY(102%);transition:transform .45s cubic-bezier(.2,.9,.2,1);z-index:2}
.scanner.manual .sc-search{transform:none}
.sc-search-head{display:flex;align-items:baseline;justify-content:space-between;margin:2px 4px 12px}
.sc-search-head h3{font-family:var(--serif);font-size:26px;font-weight:600;letter-spacing:-.01em}
.sc-search-head button{font-size:16px;color:var(--accent);font-weight:600}
.search-row{display:flex;align-items:center;gap:8px;height:50px;border-radius:25px;padding:0 6px 0 14px;background:var(--surface);box-shadow:inset 0 0 0 .5px var(--rule),0 2px 10px rgba(0,0,0,.05)}
.search-row svg{width:19px;height:19px;color:var(--ink2);flex:none}
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
.search-row input{flex:1;border:0;background:transparent;font-size:17px;outline:none;min-width:0;height:100%;-webkit-appearance:none;appearance:none}
.search-row button{height:38px;padding:0 14px;border-radius:19px;background:var(--ink);color:var(--paper);font-weight:600;font-size:14px;flex:none}
.results{flex:1;overflow-y:auto;margin-top:10px;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.res{display:flex;gap:12px;padding:10px 4px;border-bottom:.5px solid var(--rule);align-items:center;text-align:left;width:100%}
.res img,.res .ph{width:42px;height:63px;border-radius:3px;object-fit:cover;background:var(--rule);flex:none;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.res .rt{font-family:var(--serif);font-weight:600;font-size:16.5px;line-height:1.2}
.res .ra{font-size:13px;color:var(--ink2);margin-top:3px}
.res-msg{color:var(--ink2);text-align:center;padding:34px 10px;font-family:var(--serif);font-style:italic;font-size:16px;line-height:1.45}
.sc-card{position:absolute;left:10px;right:10px;bottom:calc(var(--sb) + 10px);border-radius:30px;background:var(--paper);color:var(--ink);padding:18px 18px 16px;transform:translateY(calc(100% + 60px));transition:transform .55s cubic-bezier(.25,1.15,.4,1);box-shadow:0 -10px 40px rgba(0,0,0,.35);z-index:3}
.scanner.card .sc-card{transform:none}
.card-body{display:flex;gap:16px}
.card-cover{width:92px;height:138px;flex:none;border-radius:3px;overflow:hidden;box-shadow:0 2px 4px rgba(0,0,0,.25),0 14px 24px -8px var(--tint,rgba(0,0,0,.35));background:var(--rule)}
.card-cover canvas{width:100%;height:100%;display:block}
.card-info{flex:1;min-width:0;display:flex;flex-direction:column}
.card-kicker{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-title{font-family:var(--serif);font-size:21px;font-weight:600;line-height:1.18;border:0;background:transparent;width:100%;padding:2px 0;margin-top:5px;resize:none;outline:none;border-bottom:1px solid transparent;height:52px;overflow:hidden}
.card-author{font-size:15px;color:var(--ink2);border:0;background:transparent;width:100%;padding:2px 0;outline:none;border-bottom:1px solid transparent}
.card-title:focus,.card-author:focus{border-bottom-color:var(--rule)}
.card-title::placeholder,.card-author::placeholder{color:var(--ink2);opacity:.6}
.card-meta{margin-top:auto;font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:8px}
.card-meta input{width:66px;border:0;border-radius:8px;background:var(--rule);padding:5px 8px;font-size:15px;font-variant-numeric:tabular-nums;outline:none;-webkit-appearance:none;appearance:none}
.card-pitch{font-family:var(--serif);font-style:italic;font-size:14.5px;line-height:1.4;color:var(--ink2);margin:12px 2px 0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;min-height:20px}
.card-lists{display:flex;gap:8px;margin-top:14px}
.card-lists button{flex:1;height:38px;border-radius:19px;font-size:14px;font-weight:600;color:var(--ink2);background:var(--rule);transition:background .2s,color .2s}
.card-lists button.on{background:var(--ink);color:var(--paper)}
.card-actions{display:flex;gap:10px;margin-top:12px}
.card-actions .primary{height:52px}
.card-actions .primary:disabled{opacity:.4}
.sc-card.dup .card-lists{display:none}
.sc-card.loading .card-title,.sc-card.loading .card-author,.sc-card.loading .card-cover,.sc-card.loading .card-pitch{background:linear-gradient(90deg,var(--rule) 25%,var(--surface) 50%,var(--rule) 75%);background-size:200% 100%;animation:shim 1.1s linear infinite;border-radius:6px;color:transparent}
.sc-card.loading .card-title{height:26px;margin-bottom:6px}
.sc-card.loading .card-author{height:18px;width:60%}
.sc-card.loading .card-meta{visibility:hidden}
@keyframes shim{from{background-position:100% 0}to{background-position:-100% 0}}
/* ───── Ex-libris ───── */
.seal{mix-blend-mode:normal!important;width:96px!important;height:96px!important;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35)) drop-shadow(0 1px 1px rgba(0,0,0,.4))}
.seal-prev{width:150px;height:150px;margin:14px auto 0;filter:drop-shadow(0 8px 14px rgba(0,0,0,.35));transform:rotate(-14deg)}
.seal-prev svg,.hcb-seal svg,.sx-seal svg,.opt-seal svg{width:100%;height:100%;display:block}
.xl-ini{text-align:center;font-family:var(--serif);font-style:italic;font-size:24px;letter-spacing:.12em;text-transform:uppercase}
.chips-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.em-chip{width:46px;height:46px;border-radius:14px;background:var(--surface);box-shadow:inset 0 0 0 .5px var(--rule);display:grid;place-items:center;color:var(--ink)}
.em-chip svg{width:24px;height:24px}
.em-chip.on{box-shadow:inset 0 0 0 2px var(--accent);color:var(--accent)}
.col-chip{width:40px;height:40px;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.col-chip.on{outline:2.5px solid var(--ink);outline-offset:3px}
.opt-seal{width:34px;height:34px;flex:none;transform:rotate(-12deg);filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}

/* ───── Bibliothèque : vues ───── */
.lib-views{display:flex;margin-top:10px;background:var(--rule);border-radius:12px;padding:3px}
.lib-views button{flex:1;height:32px;border-radius:9px;font-size:13px;font-weight:600;color:var(--ink2);display:flex;align-items:center;justify-content:center;gap:5px;transition:background .25s,color .25s}
.lib-views button svg{width:15px;height:15px}
.lib-views button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
[data-theme=dark] .lib-views button.on{background:rgba(255,255,255,.14)}
.lib-pane{flex:1;min-height:0;display:none;position:relative;margin-top:10px}
#scr-lib[data-view=shelves] .shelves{display:flex}
#scr-lib:not([data-view=shelves]) .shelves,#scr-lib:not([data-view=shelves]) .lib-hint,#scr-lib:not([data-view=shelves]) #libSearchBtn,#scr-lib:not([data-view=shelves]) .lib-search{display:none}
#scr-lib[data-view=room] #libRoom,#scr-lib[data-view=cards] #libCards,#scr-lib[data-view=world] #libWorld{display:block}
.lib-pane.in,.shelves.in{animation:cardIn .5s cubic-bezier(.2,.9,.25,1) both}
.pane-empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:30px 30px 0;color:var(--ink2)}
.pane-empty h3{font-family:var(--serif);font-size:22px;color:var(--ink)}
.pane-empty p{font-size:14.5px;line-height:1.45;max-width:280px}
.ghost-card{width:92px;height:128px;border-radius:7px;border:1.5px dashed color-mix(in srgb,var(--ink2) 60%,transparent);background:linear-gradient(135deg,rgba(176,138,67,.12),rgba(176,138,67,0));animation:gbFloat 4.5s ease-in-out infinite}

/* ───── Cartes holographiques ───── */
@property --mx{syntax:'<percentage>';inherits:true;initial-value:50%}
@property --my{syntax:'<percentage>';inherits:true;initial-value:50%}
#libCards{overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:0 16px 20px;margin-left:0;margin-right:0}
.cards-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 2px 12px;flex-wrap:wrap}
.cards-head b{font-family:var(--serif);font-size:19px;font-weight:600}
.rar-row,.sx-rars{display:flex;gap:6px;flex-wrap:wrap}
.rar-pill{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:12px;background:var(--surface);box-shadow:inset 0 0 0 .5px var(--rule);font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.rar-pill .hc-gem{position:static;width:9px;height:9px}
.cards-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;perspective:900px}
.cards-grid:not(.gyro) .hc-holo{animation:holoMv 8s ease-in-out infinite alternate}
.cards-grid:not(.gyro) .hc-glare{animation:glareMv 8s ease-in-out infinite alternate}
.cards-grid:not(.gyro) .hcard:nth-child(3n+2) :is(.hc-holo,.hc-glare){animation-delay:-3s}
.cards-grid:not(.gyro) .hcard:nth-child(3n) :is(.hc-holo,.hc-glare){animation-delay:-5.5s}
@keyframes holoMv{0%{transform:translate3d(-20%,-14%,0)}100%{transform:translate3d(16%,18%,0)}}
@keyframes glareMv{0%{transform:translate3d(-30%,-28%,0)}100%{transform:translate3d(26%,30%,0)}}
.hcard{--rx:0deg;--ry:0deg;--ho:.12;--ho2:0;position:relative;aspect-ratio:63/88;border-radius:5%/3.6%;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;transform:rotateX(var(--rx)) rotateY(var(--ry));cursor:pointer;-webkit-user-select:none;user-select:none}
.hc-face{position:absolute;inset:0;border-radius:inherit;-webkit-backface-visibility:hidden;backface-visibility:hidden;overflow:hidden;padding:5.5%;display:flex;flex-direction:column;box-shadow:0 10px 24px -10px rgba(0,0,0,.55),0 2px 4px rgba(0,0,0,.25)}
.hc-front{background:var(--frame);}
.hc-front::before{content:"";position:absolute;inset:4.2%;border-radius:3.5%/2.6%;background:linear-gradient(170deg,#2E241B,#15100C);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.hc-front>*{position:relative}
.r-com{--frame:linear-gradient(135deg,#6E4420,#E8B97A 42%,#8C5A2B 60%,#D9A066);--gem:#C88B4A;--ho:.06}
.r-rare{--frame:linear-gradient(135deg,#6F7A86,#F2F6FA 42%,#9AA6B2 60%,#DDE4EA);--gem:#CFE3F5;--ho:.18}
.r-epi{--frame:linear-gradient(135deg,#7A5A25,#F6E3A6 42%,#B8914A 60%,#E8CD8A);--gem:#F3C24C;--ho:.32}
.r-leg{--frame:linear-gradient(var(--fa,135deg),#ff7773,#ffed5f,#a8ff5f,#83fff7,#7894ff,#d875ff,#ff7773);--gem:#fff;--ho:.42}


.hc-top{display:flex;align-items:center;gap:6px;margin:3% 4% 3%}
.hc-name{flex:1;min-width:0;font-family:var(--serif);font-weight:600;font-size:13px;color:#F4EAD6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.big .hc-name{font-size:20px}
.hc-gem{position:relative;flex:none;width:11px;height:11px;transform:rotate(45deg);background:var(--gem);box-shadow:0 0 6px var(--gem),inset -2px -2px 0 rgba(0,0,0,.25)}
.big .hc-gem{width:16px;height:16px}
.hc-art{margin:0 4%;flex:1;min-height:0;border-radius:2px;overflow:hidden;box-shadow:0 0 0 1.5px rgba(255,230,170,.5),0 6px 12px rgba(0,0,0,.5);background:#000}

.hc-info{display:flex;justify-content:space-between;gap:6px;margin:4% 4% 0;font-size:9.5px;color:rgba(244,234,214,.75);font-style:italic;font-family:var(--serif)}
.hc-info span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.big .hc-info{font-size:14px}
.hc-bot{display:flex;align-items:center;justify-content:space-between;gap:3px;margin:3% 4% 2%;font-size:8px;color:rgba(244,234,214,.7);font-weight:700;letter-spacing:.03em;text-transform:uppercase}

.big .hc-bot{font-size:11.5px}.big .hc-stars{font-size:14px}
.hc-holo,.hc-spark,.hc-glare{position:absolute!important;pointer-events:none;will-change:transform}
.hc-holo{inset:-50%;background:repeating-linear-gradient(115deg,#ff7773 0,#ffed5f 4%,#a8ff5f 8%,#83fff7 12%,#7894ff 16%,#d875ff 20%,#ff7773 24%);mix-blend-mode:color-dodge;opacity:calc(var(--ho) + var(--ho2) * .3);filter:brightness(.75) contrast(1.3);transform:translate3d(calc((var(--mx) - 50%) * -.5),calc((var(--my) - 50%) * -.5),0)}
.hc-spark{inset:-10%;background-image:radial-gradient(circle,rgba(255,255,255,.9) 0 .6px,transparent 1px),radial-gradient(circle,rgba(255,240,200,.8) 0 .5px,transparent 1px);background-size:13px 13px,19px 19px;background-position:0 0,7px 9px;mix-blend-mode:color-dodge;opacity:0;transform:translate3d(calc((var(--mx) - 50%) * .08),calc((var(--my) - 50%) * .08),0)}
.r-epi .hc-spark,.r-leg .hc-spark{opacity:.55}
.hc-glare{inset:-50%;background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.55) 0%,rgba(255,255,255,.14) 13%,rgba(0,0,0,.18) 42%);mix-blend-mode:overlay;opacity:.8;transform:translate3d(calc((var(--mx) - 50%) * .5),calc((var(--my) - 50%) * .5),0)}
.hcard.locked{cursor:default}
.hcard.locked .hc-face{background:linear-gradient(135deg,#3A342E,#5A524A);padding:0}
.hcard.locked .hc-art{position:absolute;inset:0;margin:0;filter:grayscale(1) blur(3px) brightness(.45);box-shadow:none}
.lk{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:12px;text-align:center;color:#F1E8D8}
.lk svg{width:26px;height:26px;opacity:.85}
.lk b{font-family:var(--serif);font-size:14px;line-height:1.2}
.lk span{font-size:11px;opacity:.75}
.hc-back{transform:rotateY(180deg);background:linear-gradient(135deg,#3A2A1C,#1A120C);padding:6%}
.hcb-in{flex:1;border-radius:3%;border:1.5px solid rgba(212,175,103,.55);display:flex;flex-direction:column;align-items:center;text-align:center;padding:8% 7% 6%;color:#F1E8D8;background:radial-gradient(120% 80% at 50% 0%,rgba(212,175,103,.14),transparent 60%)}
.hcb-seal{width:34%;aspect-ratio:1;transform:rotate(-12deg);filter:drop-shadow(0 4px 6px rgba(0,0,0,.5))}
.hcb-title{font-family:var(--serif);font-weight:600;font-size:19px;line-height:1.15;margin-top:6%}
.hcb-au{font-family:var(--serif);font-style:italic;font-size:14px;opacity:.75;margin-top:2%}
.hcb-stats{display:flex;width:100%;justify-content:space-around;margin-top:7%;border-top:.5px solid rgba(212,175,103,.4);border-bottom:.5px solid rgba(212,175,103,.4);padding:4% 0}
.hcb-stats b{display:block;font-family:var(--serif);font-size:21px;color:#F3DFA2}
.hcb-stats span{font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;opacity:.7}
.hcb-q{font-family:var(--serif);font-style:italic;font-size:13.5px;line-height:1.4;margin-top:7%;opacity:.9}
.hcb-foot{margin-top:auto;font-size:10.5px;opacity:.65;display:flex;flex-direction:column;gap:3px}
.hcb-foot span{letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.card-view{position:fixed;inset:0;z-index:85;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;visibility:hidden;opacity:0;transition:opacity .35s,visibility 0s .35s;background:radial-gradient(80% 60% at 50% 42%,rgba(60,44,30,.9),rgba(8,6,4,.96));-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);touch-action:none}
.card-view.on{visibility:visible;opacity:1;transition:opacity .35s}
.cv-title{font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:#F3DFA2;text-align:center}
.cv-stage{perspective:1100px;width:min(76vw,330px)}
.cv-stage .hcard{width:100%;transition:none}
.cv-stage .hcard.big .hc-face{box-shadow:0 30px 60px -20px rgba(0,0,0,.8),0 0 40px -10px var(--gem)}
.cv-btns{display:flex;gap:12px}
.cv-btns button{height:46px;padding:0 20px;border-radius:23px;font-weight:600;font-size:15px;color:#F1E8D8;background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.2)}
.cv-x{position:absolute;top:calc(var(--st) + 12px);right:16px;width:40px;height:40px;border-radius:50%;color:#F1E8D8;background:rgba(255,255,255,.12);font-size:22px;line-height:1}

/* ───── Salle 3D ───── */
#libRoom{margin:10px 12px 0;border-radius:22px;overflow:hidden;background:#100B07;box-shadow:0 12px 30px -16px rgba(0,0,0,.6)}
#roomView{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab}
.rm-cam{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d;-webkit-transform-style:preserve-3d}
.rm-cam>div{position:absolute;transform-style:preserve-3d;-webkit-transform-style:preserve-3d}
.rm-wall{background:radial-gradient(70% 60% at 50% 45%,rgba(0,0,0,0),rgba(0,0,0,.55)),repeating-linear-gradient(90deg,#3A2516 0 2px,#4A3020 2px 74px),#3F2918;-webkit-backface-visibility:hidden;backface-visibility:hidden}
.rm-wall>*{position:absolute}
.rm-board{height:16px;background:linear-gradient(#7A5235,#4E331F);box-shadow:0 6px 10px -2px rgba(0,0,0,.6);transform:translateZ(30px)}

.rm-book{border-radius:2px 2px 1px 1px;transform:translateZ(16px);box-shadow:inset 0 0 0 .5px rgba(0,0,0,.35),inset 3px 0 4px rgba(255,255,255,.08),inset -3px 0 5px rgba(0,0,0,.4);overflow:hidden;display:flex;align-items:center;justify-content:center}
.rm-book i{position:absolute;left:2px;right:2px;top:6px;height:2px;background:rgba(212,175,103,.55)}
.rm-book span{writing-mode:vertical-rl;-webkit-writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--serif);font-weight:600;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-height:82%}
.rm-book.mine{box-shadow:inset 0 0 0 .5px rgba(0,0,0,.35),inset 3px 0 4px rgba(255,255,255,.12),0 0 12px rgba(255,200,110,.45)}
.rm-floor{background:radial-gradient(50% 50% at 50% 50%,rgba(255,170,80,.18),rgba(0,0,0,0) 70%),repeating-linear-gradient(90deg,#2E1E12 0 3px,#3D2817 3px 60px),#35231A}
.rm-rug{position:absolute;left:30%;top:30%;width:40%;height:40%;border-radius:50%;background:repeating-radial-gradient(circle,#5A1A12 0 10px,#7A2A1A 10px 18px,#B08A43 18px 20px,#4A1410 20px 30px);opacity:.85;box-shadow:0 0 0 6px #3A100B}
.rm-ceil{background:repeating-linear-gradient(0deg,#120C08 0 18px,#24170F 18px 120px),#1A110B}
.rm-window{border-radius:130px 130px 6px 6px;background:radial-gradient(60% 40% at 65% 25%,#3A4E7A,#152036 60%,#0A1222);box-shadow:inset 0 0 0 10px #3A2516,inset 0 0 0 13px #6B4A2F,0 0 60px rgba(120,150,220,.25);overflow:hidden}
.rm-moon{position:absolute;left:62%;top:16%;width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#FFF8E1,#E6DDC0 60%,#BDB38F);box-shadow:0 0 30px rgba(255,248,220,.6)}
.rm-bars{position:absolute;inset:0;background:linear-gradient(90deg,transparent calc(50% - 4px),#3A2516 calc(50% - 4px),#3A2516 calc(50% + 4px),transparent calc(50% + 4px)),linear-gradient(0deg,transparent calc(55% - 4px),#3A2516 calc(55% - 4px),#3A2516 calc(55% + 4px),transparent calc(55% + 4px))}
.rc-bob{position:absolute;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;animation:rcBob 4s ease-in-out infinite}
@keyframes rcBob{50%{transform:translateY(-9px)}}
.rc-body{position:absolute;left:-5px;top:0;width:10px;height:46px;border-radius:2px;background:linear-gradient(90deg,#CFC2A6,#FFF6E0 45%,#D8CBAE)}
.rc-body.r2,.rc-flame.r2{transform:rotateY(90deg)}
.rc-flame{position:absolute;left:-6px;top:-22px;width:12px;height:22px;border-radius:50% 50% 45% 45%/60% 60% 40% 40%;background:radial-gradient(circle at 50% 70%,#FFFFFF 0,#FFE9A8 30%,#FFB347 60%,rgba(255,140,40,0) 72%);animation:flick .18s ease-in-out infinite alternate;transform-origin:50% 100%}
@keyframes flick{to{transform:scaleY(1.12) scaleX(.92)}}
.rc-halo{position:absolute;left:-40px;top:-58px;width:80px;height:80px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,190,90,.38),rgba(255,190,90,0));animation:halo 2.6s ease-in-out infinite alternate}
@keyframes halo{to{opacity:.6;transform:scale(.9)}}
.rm-orbit{transform-style:preserve-3d;-webkit-transform-style:preserve-3d}
.rm-fly{transform-style:preserve-3d;-webkit-transform-style:preserve-3d;cursor:pointer}
.rf-bob{position:absolute;inset:0;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;animation:rfBob 5s ease-in-out infinite}
@keyframes rfBob{0%,100%{transform:translateY(0) rotateZ(-3deg) rotateY(-10deg)}50%{transform:translateY(-14px) rotateZ(3deg) rotateY(10deg)}}
.rf-bob img,.rf-grim{position:absolute;inset:0;width:100%;height:100%;border-radius:3px;-webkit-backface-visibility:hidden;backface-visibility:hidden;box-shadow:0 0 18px rgba(255,200,120,.45)}
.rf-grim{background:radial-gradient(120% 80% at 30% 20%,#7A2219,#4A1410 55%,#2E0B08);box-shadow:inset 0 0 0 2px rgba(212,175,103,.6),0 0 18px rgba(255,200,120,.4)}
.rf-back{position:absolute;inset:0;border-radius:3px;background:linear-gradient(135deg,#4A1410,#2A0A08);transform:rotateY(180deg) translateZ(1px);-webkit-backface-visibility:hidden;backface-visibility:hidden}
.room-glow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(70% 50% at 50% 115%,rgba(255,160,70,.22),transparent 70%),radial-gradient(80% 70% at 50% 50%,transparent 45%,rgba(0,0,0,.6) 100%)}
.room-hint{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:rgba(243,223,162,.7);pointer-events:none;text-shadow:0 1px 4px #000}

/* ───── Globe ───── */
#libWorld{margin:10px 12px 0;border-radius:22px;overflow:hidden;background:radial-gradient(90% 70% at 50% 40%,#16203A,#070B16);box-shadow:0 12px 30px -16px rgba(0,0,0,.6)}
#wCanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.w-top{position:absolute;left:16px;right:16px;top:14px;pointer-events:none;color:#F3DFA2}
#wStat{font-family:var(--serif);font-size:17px}
#wMiss{font-size:11.5px;color:rgba(243,223,162,.6);margin-top:3px}
.w-card{position:absolute;left:10px;right:10px;bottom:10px;border-radius:18px;padding:12px 14px;background:rgba(20,16,12,.78);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:inset 0 0 0 .5px rgba(255,230,170,.25);color:#F1E8D8;transform:translateY(130%);transition:transform .45s cubic-bezier(.2,.9,.25,1.05)}
.w-card.on{transform:none}
.wc-k{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:#E2604E}
.wc-t{font-family:var(--serif);font-size:20px;font-weight:600;margin-top:2px}
.wc-list{display:flex;gap:10px;overflow-x:auto;margin-top:10px;padding-bottom:2px}

.wc-b span{display:block;font-size:11px;line-height:1.2;margin-top:5px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.geo-row{display:flex;gap:8px;align-items:center}

.geo-st{font-size:12.5px;color:var(--ink2);margin:6px 4px 0;min-height:16px}

/* ───── Story « Mon année » ───── */
.story{position:fixed;inset:0;z-index:88;visibility:hidden;opacity:0;transition:opacity .4s,visibility 0s .4s,--s0 .8s,--s1 .8s;background:radial-gradient(90% 70% at 50% 30%,color-mix(in srgb,var(--s0,#2B2030) 55%,#000),var(--s1,#07060A));color:#F6EEDD;overflow:hidden;touch-action:none}
.story.on{visibility:visible;opacity:1;transition:opacity .4s}
@property --s0{syntax:'<color>';inherits:true;initial-value:#2B2030}
@property --s1{syntax:'<color>';inherits:true;initial-value:#07060A}
#stFx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.st-bars{position:absolute;left:12px;right:12px;top:calc(var(--st) + 10px);display:flex;gap:4px;z-index:2}
.st-bars i{flex:1;height:2.5px;border-radius:2px;background:rgba(255,255,255,.25);overflow:hidden}
.st-bars b{display:block;height:100%;background:#F3DFA2;transform-origin:0 50%;transform:scaleX(0)}
.st-x{position:absolute;top:calc(var(--st) + 22px);right:12px;width:38px;height:38px;border-radius:50%;color:#F6EEDD;font-size:24px;z-index:3}
#stSlides{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.sx{width:100%;padding:calc(var(--st) + 40px) 28px calc(var(--sb) + 30px);display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px}
.sx>*{animation:sxIn .8s cubic-bezier(.2,.9,.25,1) both}
.sx>*:nth-child(2){animation-delay:.12s}.sx>*:nth-child(3){animation-delay:.24s}.sx>*:nth-child(4){animation-delay:.36s}.sx>*:nth-child(5){animation-delay:.48s}
@keyframes sxIn{from{opacity:0;transform:translateY(24px) scale(.97)}}
.sx-k{font-size:12px;letter-spacing:.24em;text-transform:uppercase;font-weight:700;color:#E2604E}
.sx-h{font-family:var(--serif);font-weight:600;font-size:40px;line-height:1.08;letter-spacing:-.01em}
.sx-h.small{font-size:24px}
.sx-h .w{display:inline-block;white-space:nowrap}
.sx-h .ich{display:inline-block;opacity:0;filter:blur(8px);transform:translateY(8px);animation:ink .7s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(var(--i) * 40ms + .35s)}
.sx-h.foil .ich{background:linear-gradient(100deg,#B8914A,#FFF1C2 45%,#C9A45C);-webkit-background-clip:text;background-clip:text;color:transparent}
.sx-p{font-family:var(--serif);font-style:italic;font-size:19px;color:rgba(246,238,221,.8);max-width:320px}
.sx-p.top{font-size:21px}
.sx-big{font-family:var(--serif);font-weight:600;font-size:min(30vw,128px);line-height:.95;background:linear-gradient(100deg,#B8914A,#FFF1C2 45%,#C9A45C);-webkit-background-clip:text;background-clip:text;color:transparent;font-variant-numeric:tabular-nums;filter:drop-shadow(0 0 18px rgba(255,200,120,.35))}
.sx-unit{font-size:14px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:#F3DFA2}
.sx-fan{position:relative;height:150px;width:100%;margin-top:10px}
.sx-fan img{position:absolute;left:50%;top:10px;width:86px;height:128px;margin-left:-43px;object-fit:cover;border-radius:3px;box-shadow:0 12px 24px rgba(0,0,0,.6);transform-origin:50% 160%;animation:fanIn 1s cubic-bezier(.2,.9,.25,1.1) both;animation-delay:calc(var(--i) * 70ms + .4s);transform:rotate(calc(var(--k) * 11deg)) translateY(calc(var(--k) * var(--k) * 2px))}
@keyframes fanIn{from{transform:rotate(0) translateY(60px);opacity:0}}
.sx-stack{display:flex;flex-direction:column-reverse;align-items:center;height:110px;justify-content:flex-start}
.sx-stack i{display:block;width:150px;height:6px;margin-top:-1px;border-radius:1px;background:linear-gradient(90deg,#E9DEC8,#FFF8EA,#DCCFB4);box-shadow:0 1px 0 rgba(0,0,0,.25);transform:translateX(calc(sin(var(--i) * 1.7) * 6px));animation:stackIn .5s cubic-bezier(.3,1.5,.5,1) both;animation-delay:calc(var(--i) * 60ms + .3s)}
@keyframes stackIn{from{opacity:0;transform:translateY(-40px)}}
.sx-bars{display:flex;align-items:flex-end;gap:6px;height:120px;width:100%;max-width:320px}
.sx-bars i{flex:1;height:var(--h);border-radius:5px 5px 2px 2px;background:rgba(243,223,162,.35);transform-origin:50% 100%;animation:barIn .9s cubic-bezier(.2,.9,.25,1.1) both;animation-delay:calc(var(--i) * 50ms + .4s)}
.sx-bars i.top{background:linear-gradient(#FFF1C2,#B8914A);box-shadow:0 0 16px rgba(255,214,140,.6)}
.sx-row{display:flex;gap:10px;justify-content:center}
.sx-row img{width:72px;height:108px;object-fit:cover;border-radius:3px;box-shadow:0 10px 20px rgba(0,0,0,.55);animation:fanIn .9s cubic-bezier(.2,.9,.25,1.1) both;animation-delay:calc(var(--i) * 90ms + .5s)}
.sx-card{width:min(58vw,240px);perspective:900px}
.sx-card .hcard{animation:cardSpin 6s ease-in-out infinite;--mx:30%}
@keyframes cardSpin{0%,100%{transform:rotateY(-18deg) rotateX(6deg);--mx:20%;--my:30%}50%{transform:rotateY(18deg) rotateX(-6deg);--mx:80%;--my:70%}}
.sx-seal{width:150px;height:150px;animation:stamp .7s cubic-bezier(.3,1.6,.5,1) .5s both!important;filter:drop-shadow(0 10px 18px rgba(0,0,0,.5))}
.sx-rars{justify-content:center}
.sx-rars .rar-pill{background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.2);color:#F6EEDD}
.sx-share{width:min(52vw,220px);border-radius:12px;box-shadow:0 20px 40px rgba(0,0,0,.6)}
.sx-btns{display:flex;flex-direction:column;gap:10px;width:100%;max-width:300px}
.sx-btns button{height:52px;border-radius:26px;font-weight:600;font-size:16px}
.story .btn-main{background:#F6EEDD;color:#1A1714}
.story .btn-plain{background:rgba(255,255,255,.14);color:#F6EEDD}
.sx-grim{position:relative;width:120px;height:160px;perspective:700px;margin:6px 0 4px}
.sx-grim i{position:absolute;inset:0;border-radius:3px 7px 7px 3px}
.sg-back{background:#3A0F0B}
.sg-pages{inset:5px 4px 5px 8px!important;background:repeating-linear-gradient(90deg,#EDE3CF 0 2px,#D8CBAE 2px 3px)}
